---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.command: /usr/local/bin/buildctl --version
      changed_when: false
      name: Check buildkit version
      register: buildkit_test_output
    - ansible.builtin.debug:
        msg: "{{ buildkit_test_output.stdout }}"
      name: Print buildctl --version
